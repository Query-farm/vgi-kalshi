[project]
name = "vgi-kalshi-notebooks"
version = "0.1.0"
description = "Recorded public order-book depth analysis through VGI"
requires-python = ">=3.11,<3.15"
dependencies = [
    "vgi-example-notebooks @ git+https://github.com/Query-farm/vgi-example-notebooks@v0.1.3",
]

[tool.ruff]
builtins = ["coverage", "quotes", "depth", "con"] # JupySQL result captures
line-length = 110
target-version = "py313"
extend-exclude = ["artifacts", "validation"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"] # Visible SQL and result-derived prose retain readable lines
