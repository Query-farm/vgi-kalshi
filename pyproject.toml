[project]
name = "vgi-kalshi"
dynamic = ["version"]
description = "A read-only VGI (Vector Gateway Interface) worker exposing Kalshi prediction-market data to DuckDB/SQL"
readme = "README.md"
license = "MIT"
authors = [{ name = "Query Farm", email = "hello@query.farm" }]
keywords = ["vgi", "duckdb", "arrow", "kalshi", "prediction-markets", "sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "vgi-python[http]>=0.31.0",
    "httpx>=0.27",
    # Brotli lets httpx advertise `br`, which Kalshi honours. The series
    # catalog is 15.6 MB of JSON: brotli ships it in 1.35 MB against gzip's
    # 2.06 MB, and decodes marginally faster. httpx picks it up on import.
    "brotli>=1.1",
    # RSA-PSS request signing for authenticated Kalshi access. Required even
    # though authentication is optional: the signer is imported at catalog
    # build time to register the `kalshi` secret type.
    "cryptography>=42",
]

[project.optional-dependencies]
serve = ["vgi-python[http,oauth]>=0.31.0", "vgi-rpc[sentry]>=0.44.1"]

[dependency-groups]
dev = [
    "pytest>=8",
    # Pinned to a minor: the rule set is version-dependent, so an unpinned ruff
    # means CI can fail on a commit that was clean locally.
    "ruff>=0.16,<0.17",
    # Drives a real ATTACH in tests/test_end_to_end.py. Every serious defect in
    # this worker was found by executing SQL against it, not by a unit test.
    "duckdb>=1.1",
    # DuckDB materializes TIMESTAMP WITH TIME ZONE through pytz; without it a
    # scan that returns one fails at fetch time, not at bind.
    "pytz>=2024.1",
]

[project.urls]
Homepage = "https://query.farm"
Documentation = "https://query.farm/vgi/"
Repository = "https://github.com/Query-farm/vgi-kalshi"
Issues = "https://github.com/Query-farm/vgi-kalshi/issues"

[project.scripts]
vgi-kalshi = "vgi_kalshi.worker:main"
vgi-kalshi-http = "vgi_kalshi.worker:main_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "vgi_kalshi/__init__.py"

[tool.ruff]
line-length = 110
target-version = "py313"

# Selected explicitly rather than left to the default set, which changes between
# ruff releases: 0.15 and 0.16 disagreed by 99 findings on this tree, so CI and
# a developer's shell could reach opposite conclusions about the same commit.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests hit the public Kalshi API; opt in with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: hits the real Kalshi API over the network"]
